name: Site bijwerken en publiceren (GitHub Pages)

# - Bij elke push naar main (bijv. nieuwe artikelen): site bouwen en publiceren.
# - Elke 2 uur: als ANTHROPIC_API_KEY is ingesteld, eerst nieuws ophalen en artikelen schrijven.
#   Zonder sleutel wordt alleen opnieuw gebouwd (zodat "x uur geleden" en het weekoverzicht kloppen).
# - Handmatig starten kan via het tabblad Actions.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: Nieuws schrijven (alleen bij schema/handmatig én met API-sleutel) en site bouwen
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            python -m pipeline.run
          else
            python -m pipeline.run --build
          fi

      - name: Nieuwe artikelen opslaan
        if: github.event_name != 'push'
        run: |
          git config user.name "cybersecuritynieuws-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "Geen nieuwe content."
          else
            git commit -m "Nieuwe artikelen $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nieuwe pagina's aanmelden bij zoekmachines (IndexNow)
        run: |
          pip install pyyaml
          python tools/indexnow.py
