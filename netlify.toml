# Netlify bouwt de site bij elke push naar main (ook de pushes met nieuwe artikelen van GitHub Actions).
# Netlify installeert requirements.txt automatisch.
[build]
  command = "python -m pipeline.run --build"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# Beveiligingsheaders – een cybersecuritysite moet zelf het goede voorbeeld geven.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://images.pexels.com; connect-src 'self'; form-action 'self' https:; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "https://www.cybersecuritynieuws.com/*"
  to = "https://cybersecuritynieuws.com/:splat"
  status = 301
  force = true
